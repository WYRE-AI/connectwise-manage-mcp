services:
  # Gateway mode. ConnectWise credentials arrive per request on X-CW-* headers.
  # Do not set CW_MANAGE_COMPANY_ID, CW_MANAGE_PUBLIC_KEY, CW_MANAGE_PRIVATE_KEY,
  # CW_MANAGE_CLIENT_ID, or env_file here — that would put static vendor
  # credentials in the container. The project .env is used only for Compose
  # interpolation of CONDUIT_S2S_SECRET and LOG_LEVEL. For AUTH_MODE=env, pass
  # CW_MANAGE_* on that process instead (see the README).
  connectwise-manage-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: ghcr.io/wyre-ai/connectwise-manage-mcp:latest
    container_name: connectwise-manage-mcp-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - MCP_TRANSPORT=http
      - MCP_HTTP_HOST=0.0.0.0
      - MCP_HTTP_PORT=8080
      - AUTH_MODE=gateway
      - CONDUIT_S2S_SECRET=${CONDUIT_S2S_SECRET:?set CONDUIT_S2S_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes: {}
